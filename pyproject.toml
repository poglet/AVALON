[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avalon-core"
version = "0.1.0"
description = "AVALON — Automated Vulnerability Analysis and Logical Offensive Network: an autonomous pentesting framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AVALON contributors" }]
keywords = ["security", "pentest", "autonomous", "llm", "openrouter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
avalon = "avalon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/avalon"]

[tool.hatch.build.targets.sdist]
exclude = [
  "scopeweaver-main",
  "plans",
  "idea.md",
  "dist",
  ".venv",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["scopeweaver-main", ".avalon"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: opt-in integration tests against a local target (never in CI)",
]
addopts = "-m 'not integration'"
